musicsettings_play_by_folder = Přehrávat po složkách
musicsettings_folder_chaining_note = Na konci složky přehrávání pokračuje další: nejdřív ostatní alba interpreta, pak volné skladby v jeho složce a teprve potom další interpret. Po poslední složce se vrátí k první. Jen pro složky otevřené z Průzkumníku, ne pro seznamy knihovny.
musicsettings_scan_options = Možnosti prohledávání
musicsettings_do_not_ignore_articles = Neignorovat členy
musicsettings_detect_changes = Zjišťovat změny
musicsettings_detect_changes_note = Při spuštění a když se karta microSD vrátí do přehrávače (znovu vložená, vysunutá z počítače nebo po přenosu přes Wi-Fi) se nové skladby ve složkách vybraných k prohledání přidají do knihovny a smazané se odeberou, bez nového prohledávání. Kontrola běží na pozadí a ve stavovém řádku se zobrazí ikona.
musicsettings_detect_retagged = Zjišťovat změněné skladby
musicsettings_detect_retagged_note = Zjišťování změn znovu načte i skladby upravené od prohledání, například s novými značkami. Kontroluje datum každého souboru, takže trvá déle.
