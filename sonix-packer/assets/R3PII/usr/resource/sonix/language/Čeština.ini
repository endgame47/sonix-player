musicsettings_soundstage_note = Nastavuje šířku stereo obrazu: 1,00 skladbu nemění, 0,00 ji sloučí do mono a 2,00 scénu rozšíří. Jen pro stereo skladby.
musicsettings_balance_note = Přesouvá zvuk k jednomu uchu ztlumením druhého kanálu, nikdy zesílením vybraného: skladba, která už je na plné úrovni, tak nemůže zkreslit. Jen pro stereo skladby.
