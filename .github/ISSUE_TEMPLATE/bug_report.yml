name: Bug report
description: A feature that Sonix Player has is not working as it should. Please attach the log.
title: "[BUG] "
labels: ["bug"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Read this before you go on.**
        >
        > A **bug** is a feature that Sonix Player **has**, but that **does not work** as it should.
        >
        > If Sonix Player does not do something **at all**, that is **not a bug**: it simply has not been made yet.
        > Open a **Feature request** instead.
        > This is true even if the stock HiBy firmware does it.
        >
        > Everything Sonix Player can do is in the **[feature list](https://github.com/Jepl4r/sonix-player/blob/main/FEATURES.md)**.
        > If what you expected is not in that list, **do not open a bug report**.
        >
        > Bug reports about missing features will be closed. Without the log, a problem cannot be looked into.

  - type: markdown
    attributes:
      value: |
        **Examples**

        | Bug | Not a bug (feature request) |
        |---|---|
        | Gapless is on, but there is a gap between two tracks of the same album. | The player does not do something that is not in the feature list. |
        | The library scan stops halfway and some albums are missing. | The stock HiBy firmware does something that Sonix Player does not. |
        | Sonix Player crashes when you open a playlist. | You would like an existing feature to work in a different way. |

        One problem per report, please. Write in English.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you open this report
      description: All boxes must be ticked.
      options:
        - label: I checked the [feature list](https://github.com/Jepl4r/sonix-player/blob/main/FEATURES.md). What I am reporting is **in the list**, and it does **not** work as described there.
          required: true
        - label: I am using the **latest** version of Sonix Player, and the problem is still there.
          required: true
        - label: I searched the [open and closed issues](https://github.com/Jepl4r/sonix-player/issues?q=is%3Aissue), and this problem has not been reported yet.
          required: true
        - label: I will attach the log file below. I understand that without it the problem cannot be looked into.
          required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - R1
        - R3 Pro II
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Sonix Player version
      description: You find it in Settings > System > About.
      placeholder: e.g. 1.1.0
    validations:
      required: true

  - type: input
    id: feature
    attributes:
      label: Which feature does not work?
      description: Its name as written in the feature list.
      placeholder: e.g. Gapless
    validations:
      required: true

  - type: textarea
    id: bug
    attributes:
      label: What happens
      description: Describe what goes wrong, clearly and briefly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The exact steps, one per line, starting from the main screen. Say whether it happens every time or only sometimes.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. ...
        It happens every time.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen instead
      description: What the feature list says the feature does.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log (required)
      description: |
        How to get the log:

        1. Go to Settings > System > About and tap "Build number" five times, until a pop-up says that developer options are turned on.
        2. Go to Settings > Developer options and turn on "Log to microSD". If the problem happens during a library scan, also turn on "Database log".
        3. Make the problem happen again.
        4. Attach the file `.local/sonix_player.log` from the root of the microSD card. `.local` is a hidden folder: on a Mac press Cmd+Shift+. in Finder to see it, on Windows turn on "Hidden items" in the View menu of File Explorer.

        Drag the file into the box below. Do not paste the log as text.
      placeholder: Drag the sonix_player.log file here
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, videos and anything else
      description: Optional.
